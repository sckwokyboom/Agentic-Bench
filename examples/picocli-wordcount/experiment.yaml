name: picocli-countwords
fixture_path: ./fixtures/wordcount-stripped
reference_path: ./fixtures/wordcount-original
task_prompt: ./prompts/task.md
system_prompt: ./prompts/system.md

# Default model is opencode-native free (no extra credentials needed).
# To switch to the official DeepSeek API after `opencode providers login`:
#   model: deepseek/deepseek-chat
# Or via OpenRouter (paid, cheap):
#   model: openrouter/deepseek/deepseek-chat-v3.1
model: opencode/deepseek-v4-flash-free

repetitions: 2          # 2 conditions x 2 reps = 4 runs, ~3-5 minutes total
output_dir: ./runs
timeout_s: 300

opencode:
  agent: abench

conditions:
  - {name: baseline,  augmentation: null}
  - {name: augmented, augmentation: ./slices/countwords-graph-slice.md}

metrics:
  # Detect Java build/test invocations as test runs.
  test_command_patterns:
    - "(mvn|mvnw)( |$)"
    - "(gradle|gradlew)( |$)"
    - "junit"
    - "pytest"
