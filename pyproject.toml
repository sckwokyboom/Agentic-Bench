[project]
name = "abench"
version = "0.1.0"
description = "Agentic-Bench: harness for comparing OpenCode agent runs"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6",
    "pydantic>=2",
    "httpx>=0.27",
    "httpx-sse>=0.4",
    "pandas>=2",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
abench = "abench.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
