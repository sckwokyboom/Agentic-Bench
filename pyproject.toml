[project]
name = "abench"
version = "0.1.0"
description = "Agentic-Bench: harness for comparing OpenCode agent runs"
requires-python = ">=3.12"
dependencies = [
    "pyyaml>=6",
    "pydantic>=2",
    "httpx>=0.27",
    "httpx-sse>=0.4",
    "pandas>=2",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "cachetools>=5.3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
# LangGraph orchestrator (opt-in via ABENCH_ORCHESTRATOR=langgraph). Narrow surface:
# StateGraph + reducers only. Lazy-imported, so the default path doesn't need it.
langgraph = ["langgraph>=0.2,<0.4"]

[project.scripts]
abench = "abench.cli:main"
abench-ui = "abench_ui.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
