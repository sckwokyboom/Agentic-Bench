# rcc-only smoke on the putValue mutant (host mode). ONE condition, reps=1 —
# a fast single pass to eyeball the RapidCausalCoder loop end-to-end (artifact
# builder auto-selected from the committed overlay mutation-graph.json.gz) before
# committing to the full phased-vs-rcc A/B (experiment-mac-rcc-ab.yaml).
#
# Run (venv active, JDK 21):
#   JAVA_HOME=/opt/homebrew/opt/openjdk@21 \
#     .venv/bin/abench run experiments/picocli-putValue/experiment-mac-rcc-smoke.yaml
name: picocli-putValue-rcc-smoke
fixture_path: ./stripped
reference_path: ./original
task_prompt: ./prompts/task.md
system_prompt: ./prompts/system.md

model: openrouter/nvidia/nemotron-3-super-120b-a12b:free
timeout_s: 1800
repetitions: 1
output_dir: ./runs

opencode:
  agent: abench
  sandbox:
    mode: none

orchestration:
  target_label: the TextTable.putValue method
  max_diagnose_iters: 8
  no_progress_limit: 2
  cluster_cap: 5
  rcc_max_attempts: 2
  rcc_subset_class_cap: 15
  rcc_revert_to_best: true   # demo: keep the best-reached worktree (rcc strategy)

conditions:
  - name: rcc
    orchestration: rcc
    overlay: ./overlays/impact-artifacts
    restore_non_target_before_verify: true

target_file: src/main/java/picocli/CommandLine.java
target_methods: [putValue]

verify:
  timeout_s: 1800

metrics:
  test_command_patterns:
    - "(mvn|mvnw)( |$)"
    - "gradle(w)?( |$)"
