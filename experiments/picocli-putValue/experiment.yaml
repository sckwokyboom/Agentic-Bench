name: picocli-putValue
fixture_path: ./stripped
reference_path: ./original
task_prompt: ./prompts/task.md
system_prompt: ./prompts/system.md

# Direct DeepSeek API (OpenAI-compatible endpoint, key from DEEPSEEK_API_KEY —
# forwarded into the sandbox container automatically).
model: deepseek/deepseek-v4-flash

repetitions: 3
output_dir: ./runs
# No per-run timeout: the agent works as long as it needs (cancel a wedged run
# manually). Verify below keeps its own bound.
timeout_s: null

opencode:
  agent: abench
  tools_lib: graph-tipper
  providers:
    - id: deepseek
      name: DeepSeek API
      base_url: https://api.deepseek.com/v1
      models: [deepseek-v4-flash, deepseek-chat, deepseek-reasoner]
      api_key_env: DEEPSEEK_API_KEY
    # To run on your LOCAL vLLM devstral2 endpoint instead: set `model:` above to
    # `local/devstral2-24B` and add this OpenAI-compatible provider —
    #   - id: local
    #     name: Local vLLM
    #     base_url: http://127.0.0.1:8000/v1     # your vLLM host:port + /v1
    #     models: [devstral2-24B]                # the served model id
    #     api_key_env: VLLM_API_KEY              # any non-empty value if auth is off
  sandbox:
    mode: container
    cache_mounts:
      # GT's opencode tools (read-only; the entrypoint copies them in).
      - "{lib:graph-tipper}:/opt/graph-tipper:ro"
      # NOTE: do NOT mount the host ~/.gradle here. The Gradle cache is baked
      # into the sandbox image (docker/Dockerfile.sandbox, gradle-warm stage),
      # WRITABLE — so `./gradlew test` runs fully offline with no config. A
      # read-only `…/.gradle:ro` mount re-breaks the wrapper (it must write its
      # lock + unpack the distribution: "…gradle-8.14-bin.zip.lck (Read-only
      # file system)") and would shadow the baked cache.

conditions:
  # Optional per-condition `temperature: 0.0..2.0` (blank = provider default).
  # Vary it across conditions to A/B sampling temperature itself.
  - {name: baseline,          augmentation: null, tools: []}
  - {name: augmented,         augmentation: ./slices/putValue-graph-slice.md, tools: []}
  - {name: augmented-verbose, augmentation: ./slices/putValue-graph-slice-verbose.md, tools: []}
  # ── Prompt-methodology A/B: forced "instrument the existing test, observe the
  # data flow, THEN implement" vs the autonomous baseline. Prompt-only (no tools/
  # overlay). system_augmentation lifts system.md's "don't touch tests" rule for
  # THIS condition only (else the treatment is suppressed); restore_non_target_
  # before_verify strips the temporary test instrumentation before grading
  # (no-op for baseline → no confound). For a FOCUSED run, pick just `baseline` +
  # `forced-instrument` in the UI Run dialog (or run experiment-forced-instrument.yaml).
  - name: forced-instrument
    augmentation: ./slices/forced-instrument-in-test.md
    system_augmentation: ./slices/forced-instrument-system.md
    tools: []
    restore_non_target_before_verify: true
  - name: augmented-tool          # = the orchestration CONTROL (impact tool, autonomous loop)
    augmentation: ./slices/impact-tool-briefing.md
    overlay: ./overlays/impact-artifacts
    tools: [impact]
  # ── Orchestration A/B: forced fix-methodology vs the autonomous tool loop ──
  # Compare `augmented-tool` (control) vs `phased` / `phased-plan`. Same model,
  # tool, overlay, fixture — the ONLY difference is the forced phase controller.
  # (For a FOCUSED orchestration run, comment out baseline/augmented/augmented-
  # verbose above so only these four run.)
  - name: phased
    augmentation: ./slices/impact-tool-briefing.md
    overlay: ./overlays/impact-artifacts
    tools: [impact]
    orchestration: phased            # UNDERSTAND → IMPLEMENT → DIAGNOSE
  - name: phased-plan
    augmentation: ./slices/impact-tool-briefing.md
    overlay: ./overlays/impact-artifacts
    tools: [impact]
    orchestration: phased_plan       # + the PLAN phase
  # Ablation: identical to `phased` EXCEPT the controller focuses the DIAGNOSE
  # loop on failure clusters inside the target's graph blast radius (reads
  # .impact/coverage.json from the overlay). Compare phased vs phased-graph by
  # trace to isolate what the graph adds ON TOP of the methodology.
  - name: phased-graph
    augmentation: ./slices/impact-tool-briefing.md
    overlay: ./overlays/impact-artifacts   # required: controller reads .impact/coverage.json
    tools: [impact]
    orchestration: phased_graph
  # Ablation: identical to `phased` EXCEPT the controller attaches a Byte Buddy
  # probe to the test JVM and injects a runtime diagnostic card (actual args +
  # call corridor + throw) into DIAGNOSE. Compare phased vs phased-runtime by
  # trace to isolate what runtime evidence adds ON TOP of the methodology.
  # Requires the host agent jar:  cd docker/runtime-probe && ./gradlew jar
  - name: phased-runtime
    augmentation: ./slices/impact-tool-briefing.md
    overlay: ./overlays/impact-artifacts
    tools: [impact]
    orchestration: phased_runtime
  # RapidCausalCoder: same UNDERSTAND→IMPLEMENT prefix as `phased`, but the repair
  # loop is the causal-debug cycle (mutation graph → contracts → invasive println
  # probes → CausalDeltaSubGraph → CausalRank → targeted fix). The overlay ships the
  # precomputed leak-safe GT mutation graph (.impact/mutation-graph.json.gz) so the
  # builder = artifact (no Joern at run time). Compare `phased` vs `rcc` by trace /
  # rcc_root_rank. For a FOCUSED run pick just `phased` + `rcc` in the UI Run dialog.
  - name: rcc
    augmentation: ./slices/impact-tool-briefing.md
    overlay: ./overlays/impact-artifacts
    tools: [impact]
    orchestration: rcc

target_file: src/main/java/picocli/CommandLine.java
target_methods: [putValue]

# Scaffolding for the `phased` / `phased-plan` conditions above. Task label;
# the controller logic itself stays task-agnostic.
orchestration:
  target_label: "TextTable.putValue"
  max_diagnose_iters: 8
  no_progress_limit: 2
  cluster_cap: 5
  # For the `rcc` condition: repair-loop attempt budget + subset test-class cap.
  rcc_max_attempts: 2
  rcc_subset_class_cap: 15
  rcc_revert_to_best: true   # demo: keep the best-reached worktree (rcc strategy)
  # For the `phased-runtime` condition: full binary FQN(s) the probe instruments
  # (note the '$'-nested class). Confirmed by the spike's captured stack frame.
  probe_targets: ["picocli.CommandLine$Help$TextTable.putValue"]

verify:
  timeout_s: 1800

metrics:
  test_command_patterns:
    - "(mvn|mvnw)( |$)"
    - "(gradle|gradlew)( |$)"
    - "junit"
