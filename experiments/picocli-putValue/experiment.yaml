name: picocli-putValue
fixture_path: ./stripped
reference_path: ./original
task_prompt: ./prompts/task.md
system_prompt: ./prompts/system.md

# Direct DeepSeek API (OpenAI-compatible endpoint, key from DEEPSEEK_API_KEY —
# forwarded into the sandbox container automatically).
model: deepseek/deepseek-chat

repetitions: 3
output_dir: ./runs
# No per-run timeout: the agent works as long as it needs (cancel a wedged run
# manually). Verify below keeps its own bound.
timeout_s: null

opencode:
  agent: abench
  tools_lib: graph-tipper
  providers:
    - id: deepseek
      name: DeepSeek API
      base_url: https://api.deepseek.com/v1
      models: [deepseek-chat, deepseek-reasoner]
      api_key_env: DEEPSEEK_API_KEY
  sandbox:
    mode: container
    cache_mounts:
      - "{lib:graph-tipper}:/opt/graph-tipper:ro"
      - "{env:HOME}/.gradle:/root/.gradle:ro"

conditions:
  - {name: baseline,          augmentation: null, tools: []}
  - {name: augmented,         augmentation: ./slices/putValue-graph-slice.md, tools: []}
  - {name: augmented-verbose, augmentation: ./slices/putValue-graph-slice-verbose.md, tools: []}
  - name: augmented-tool
    augmentation: ./slices/impact-tool-briefing.md
    overlay: ./overlays/impact-artifacts
    tools: [impact]

target_file: src/main/java/picocli/CommandLine.java
target_methods: [putValue]

verify:
  timeout_s: 1800

metrics:
  test_command_patterns:
    - "(mvn|mvnw)( |$)"
    - "(gradle|gradlew)( |$)"
    - "junit"
