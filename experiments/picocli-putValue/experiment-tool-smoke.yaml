# Risk-gate 18.3 smoke: ONE container rep of the tool condition only.
# Validates that opencode inside the docker sandbox discovers the installed
# impact tool, reads the static overlay impact.json, and the impact tool returns
# markdown analysis of the agent's diff — before committing to the full 4×3
# run. Identical to experiment.yaml except: single condition, repetitions 1.
#
# Needs DEEPSEEK_API_KEY in the environment (forwarded into the container
# automatically). Run:
#   DEEPSEEK_API_KEY=sk-... HOME=$HOME JAVA_HOME=<jdk21> \
#     abench run experiments/picocli-putValue/experiment-tool-smoke.yaml
name: picocli-putValue-tool-smoke
fixture_path: ./stripped
reference_path: ./original
task_prompt: ./prompts/task.md
system_prompt: ./prompts/system.md

# Direct DeepSeek API (OpenAI-compatible endpoint, key from DEEPSEEK_API_KEY).
model: deepseek/deepseek-chat

# No per-run timeout: the agent works as long as it needs (cancel manually if
# it wedges). Verify keeps a bound — it's the harness's measurement step.
timeout_s: null

repetitions: 1
output_dir: ./runs

opencode:
  agent: abench
  tools_lib: graph-tipper
  providers:
    - id: deepseek
      name: DeepSeek API
      base_url: https://api.deepseek.com/v1
      models: [deepseek-chat, deepseek-reasoner]
      api_key_env: DEEPSEEK_API_KEY
  sandbox:
    mode: container
    cache_mounts:
      - "{lib:graph-tipper}:/opt/graph-tipper:ro"
      - "{env:HOME}/.gradle:/root/.gradle:ro"

conditions:
  - name: augmented-tool
    augmentation: ./slices/impact-tool-briefing.md
    overlay: ./overlays/impact-artifacts
    tools: [impact]

target_file: src/main/java/picocli/CommandLine.java
target_methods: [putValue]

verify:
  timeout_s: 1800

metrics:
  test_command_patterns:
    - "(mvn|mvnw)( |$)"
    - "(gradle|gradlew)( |$)"
    - "junit"
